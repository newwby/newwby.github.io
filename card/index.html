<!DOCTYPE html>

<head>

  <title>Daniel Newby · A&amp;I Solutions</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --bg: #070b18;
      --bg-2: #0c1330;
      --line: #1b2a5c;
      --text: #eef2ff;
      --muted: #93a0c8;
      --cyan: #22d3ee;
      --blue: #3b82f6;
      --violet: #8b5cf6;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; background: var(--bg); }
    body {
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .screen {
      position: relative;
      min-height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      padding: max(env(safe-area-inset-top), 28px) 24px max(env(safe-area-inset-bottom), 24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: radial-gradient(120% 70% at 50% 42%, var(--bg-2) 0%, var(--bg) 70%);
      isolation: isolate;
    }
    .circuit {
      position: absolute; inset: 0; width: 100%; height: 100%;
      z-index: -1; opacity: .55; pointer-events: none;
    }
    .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
    .logo {
      width: 92px; height: 92px; border-radius: 50%;
      box-shadow: 0 0 28px rgba(34, 211, 238, .25), 0 0 60px rgba(139, 92, 246, .18);
    }
    h1 { font-size: 1.6rem; font-weight: 650; letter-spacing: .01em; }
    .backronym {
      font-family: var(--mono); font-size: .78rem; letter-spacing: .14em;
      text-transform: uppercase; color: var(--muted);
    }
    .backronym b { color: var(--cyan); font-weight: 700; }
    .backronym b.v { color: var(--violet); }

    .qr-wrap {
      position: relative; padding: 2px; border-radius: 22px;
      background: linear-gradient(135deg, var(--cyan), var(--blue) 50%, var(--violet));
      box-shadow: 0 0 36px rgba(59, 130, 246, .35);
    }
    .qr {
      display: block; width: min(72vw, 300px); height: auto;
      background: #fff; border-radius: 20px; padding: 10px;
      image-rendering: pixelated;
    }
    .hint {
      margin-top: 12px; text-align: center;
      font-family: var(--mono); font-size: .72rem; letter-spacing: .12em;
      text-transform: uppercase; color: var(--muted);
    }

    .person { width: 100%; display: grid; gap: 6px; }
    .name { font-size: 1.15rem; font-weight: 600; text-align: center; margin-bottom: 4px; }
    .row {
      display: flex; align-items: center; gap: 10px;
      min-height: 44px; padding: 0 14px; border-radius: 12px;
      border: 1px solid var(--line); background: rgba(12, 19, 48, .6);
      color: var(--text); text-decoration: none;
      font-family: var(--mono); font-size: .8rem;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .row svg { flex: none; width: 18px; height: 18px; stroke: var(--cyan); fill: none; stroke-width: 1.6; }
    .row span { overflow: hidden; text-overflow: ellipsis; }
    .row.email { font-size: clamp(.6rem, 2.75vw, .8rem); padding: 0 12px; }
    .row:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    .vcf { text-align: center; font-family: var(--mono); font-size: .7rem; color: var(--muted); }
    .vcf a { color: var(--muted); }
  </style>
</head>

    <header class="brand">

</html>

<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>AGS Study Pack</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: lanyard-badge header, tab rail, single reading column (max 760px) */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#152238; --muted:#5a6680; --line:#d5dbe6;
  --accent:#c98a00; --accent-ink:#ffffff; --accent-soft:#fbf0d4; --navy:#1d3461;
  --good:#1f7a5a; --warn:#b5520b; --bad:#b3261e;
  --display:"Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1524; --surface:#172238; --ink:#e7ebf3; --muted:#9aa6bf; --line:#2a3854;
  --accent:#f2c14e; --accent-ink:#1a1405; --accent-soft:#3a3115; --navy:#9fb8e8;
  --good:#5cc79c; --warn:#f0a35e; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1524; --surface:#172238; --ink:#e7ebf3; --muted:#9aa6bf; --line:#2a3854;
  --accent:#f2c14e; --accent-ink:#1a1405; --accent-soft:#3a3115; --navy:#9fb8e8;
  --good:#5cc79c; --warn:#f0a35e; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:1.35rem;margin-block:28px 12px}
h3{font-size:1.05rem;margin-block:20px 8px}
p{margin:0 0 10px}
code,.mono{font-family:var(--mono);font-size:.92em}
a{color:var(--navy)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* badge header */
.badge{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.badge .strap{height:10px;background:repeating-linear-gradient(90deg,var(--navy) 0 18px,var(--accent) 18px 36px)}
.badge .inner{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;padding:16px 18px 18px}
.badge h1{font-size:clamp(1.6rem,5vw,2.2rem);letter-spacing:-.01em}
.badge .sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.stand{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.stand .lbl{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stand .num{font-family:var(--mono);font-size:1.6rem;font-weight:700;color:var(--navy)}

/* tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;margin-top:6px}
.tabrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabrow::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .88rem var(--body);padding:8px 13px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}

/* generic blocks */
.panel{min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .v{font-family:var(--display);font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums}
.tile .k{color:var(--muted);font-size:.82rem}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 8px 8px 0;margin-block:12px;font-size:.92rem}
.note.warn{border-left-color:var(--warn)}
.note b{font-weight:700}
ul.tight{margin:0 0 10px;padding-left:20px}
ul.tight li{margin-block:3px}

/* chain diagram */
.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin-block:8px}
.node{flex:1 1 120px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.85rem}
.node b{display:block;font-family:var(--display)}
.node.hl{border-color:var(--accent);background:var(--accent-soft)}
.arrow{align-self:center;color:var(--muted);font-weight:700}
.formula{font-family:var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.88rem;overflow-x:auto;white-space:pre}

/* flashcards */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .88rem var(--body);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.card{perspective:1200px;cursor:pointer;user-select:none}
.card .face{min-height:220px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:22px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.card .deck{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card .front{font-family:var(--display);font-size:clamp(1.4rem,5vw,1.9rem);font-weight:700}
.card .back{font-size:1.05rem}
.card .hint{color:var(--muted);font-size:.8rem}
.progress{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.known{color:var(--good);font-weight:600}

/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.q .stem{font-family:var(--display);font-size:1.1rem;font-weight:600;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:10px 12px;border-radius:8px;cursor:pointer}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.explain{margin-top:12px;font-size:.92rem}

/* objections */
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-block:8px}
summary{cursor:pointer;padding:12px 14px;font-weight:600;font-family:var(--display)}
details > div{padding:0 14px 14px}
.src{color:var(--muted);font-size:.78rem}

/* checklist + leads */
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
form.lead{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
form.lead label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
form.lead input,form.lead select,form.lead textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
form.lead .full{grid-column:1/-1}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:600;border:1px solid}
.pill.hot{color:var(--bad);border-color:var(--bad)}
.pill.warm{color:var(--warn);border-color:var(--warn)}
.pill.cold{color:var(--navy);border-color:var(--navy)}
.leadlist{display:grid;gap:8px;margin-top:12px}
.leaditem{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.leaditem .meta{color:var(--muted);font-size:.85rem}
textarea.out{width:100%;min-height:120px;font-family:var(--mono);font-size:.8rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .8rem var(--body);padding:6px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tlist{display:grid;gap:8px}
.titem{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.titem input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.titem .body{min-width:0;flex:1}
.titem .top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.titem .nm{font-family:var(--display);font-weight:700}
.titem .st{font-family:var(--mono);font-size:.85rem;color:var(--navy);font-weight:700}
.titem .meta{color:var(--muted);font-size:.85rem;margin-top:2px}
.titem.done{opacity:.55}
.titem.done .nm{text-decoration:line-through}
.pill.syn{color:var(--good);border-color:var(--good)}
.pill.pro{color:var(--warn);border-color:var(--warn)}
.pill.chk{color:var(--bad);border-color:var(--bad)}
.pill.non{color:var(--muted);border-color:var(--line)}
input.search{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;flex:1 1 180px;min-width:0}
@media (prefers-reduced-motion:no-preference){.card .face{transition:transform .25s ease}.card:active .face{transform:scale(.99)}}

/* competitor + audit views */
.vd{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.74rem;font-weight:700;letter-spacing:.03em;border:1px solid;white-space:nowrap}
.vd.ahead{color:var(--good);border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.vd.par{color:var(--navy);border-color:var(--navy)}
.vd.behind{color:var(--bad);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.vd.unique{color:var(--accent-ink);border-color:var(--accent);background:var(--accent)}
.vd.risk{color:var(--warn);border-color:var(--warn)}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tally .tile .v{display:flex;align-items:center;gap:8px}
table.mx th:first-child,table.mx td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
table.mx td.y{color:var(--good);font-weight:700;text-align:center}
table.mx td.x{color:var(--muted);text-align:center}
table.mx td.p{color:var(--warn);font-weight:600;text-align:center}
table.mx th{text-align:center;white-space:nowrap}
table.mx th:first-child{text-align:left}
table.mx tr.wow td{background:var(--accent-soft)}
table.mx tr.wow td:first-child{background:var(--accent-soft)}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin-block:4px 6px}
.subnav a{font-size:.8rem;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:4px 10px;border-radius:6px}
.subnav a:hover{border-color:var(--navy)}
.rival{display:grid;gap:4px}
.rival .facts{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:.82rem}
.rival .facts b{color:var(--ink);font-weight:600}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.two > div{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.two h3{margin-top:0}
.score{font-family:var(--mono);font-weight:700;text-align:center}
.score.s5,.score.s4{color:var(--good)}
.score.s3{color:var(--navy)}
.score.s2,.score.s1{color:var(--bad)}
ol.src-list{font-size:.78rem;color:var(--muted);padding-left:22px;word-break:break-all}
ol.src-list li{margin-block:2px}
.conf{font-size:.72rem;color:var(--muted);font-family:var(--mono)}
.panel h2[id]{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 64px)}

/* ---------- v2: login, two-level nav, grid, pitch card, leads, settings ---------- */
.panel h2[id]{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 120px)}
.login{max-width:420px;margin:28px auto 0;display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.login h2{margin:0}
.login label,.fld{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.login input:not([type=checkbox]),.fld input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.login .chk{flex-direction:row;align-items:center;gap:8px}
.login .chk input{width:18px;height:18px;accent-color:var(--accent)}
.login .btn{padding:11px 14px}
.err{color:var(--bad);font-weight:600;min-height:1.2em;margin:0}
.unlocking{text-align:center;color:var(--muted);margin-top:40px}
.subrow{margin-top:8px}
.tab.home{font-size:1rem;padding-inline:12px}
.toprow-wrap{display:flex;gap:6px;align-items:center}
.toprow-wrap .tabrow{flex:1 1 auto;min-width:0}
.tab.user{flex:0 0 auto;max-width:11em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.user .uname{margin-left:6px}
@media (max-width:520px){.tab.user .uname{display:none}.toprow-wrap .tab{padding:8px 10px;font-size:.84rem}}
.subrow .tab{font-size:.8rem;padding:6px 11px;background:transparent}
.subrow .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
a.tab{text-decoration:none;display:inline-flex;align-items:center}
.hello{margin-top:18px}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gtile{display:flex;flex-direction:column;gap:6px;min-height:150px;padding:16px 16px 22px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;position:relative;overflow:hidden}
.gtile b{font-family:var(--display);font-size:clamp(1.25rem,5vw,1.7rem);letter-spacing:.02em}
.gtile .gd{color:var(--muted);font-size:.85rem}
.gtile .gnum{font-family:var(--mono);font-size:.78rem;color:var(--accent);font-weight:700}
.gtile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--navy) 0 18px,var(--accent) 18px 36px)}
.gtile:hover{border-color:var(--navy)}
.pcard{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--navy);border-radius:16px;padding:16px 18px 18px;margin-top:20px}
.pcard.aff{border-top-color:var(--accent)}
.pcard-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pcard-aud{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pcard-q{color:var(--muted);font-size:.78rem;margin-top:14px}
.pcard-one{font-family:var(--display);font-size:clamp(1.1rem,4.2vw,1.35rem);font-weight:600;margin:4px 0 0;line-height:1.35}
.pcard hr{border:0;border-top:1px dashed var(--line);margin:14px 0 10px}
.pcard-label{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-family:var(--display);font-weight:700}
.pcard-text{min-height:9.5em;font-size:1.02rem;margin-top:6px}
.pcard-note{color:var(--warn);font-size:.82rem;margin-top:8px}
.pcard-slide{display:flex;gap:8px;align-items:center;margin-top:12px}
.pcard-slide input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
ol.steps{padding-left:22px;margin:0;display:grid;gap:12px}
ol.steps li::marker{font-weight:700;color:var(--muted)}
.say{border-left:3px solid var(--accent);padding-left:9px;margin-top:4px;font-style:italic}
.risk{color:var(--warn);font-size:.82rem;margin-top:2px}
.t-hot{color:var(--bad);font-weight:700}.t-warm{color:var(--warn);font-weight:700}.t-cold{color:var(--navy);font-weight:700}
select.t-hot,select.t-warm,select.t-cold{font-weight:700}
.req{color:var(--bad);font-weight:700}
[aria-invalid="true"]{border-color:var(--bad)!important}
.mailbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);flex:1 1 220px;min-width:0}
.mailbox input{font:inherit;color:var(--ink);border:0;background:transparent;padding:8px 10px;min-width:0;flex:1}
.mailbox span{padding-right:10px;color:var(--muted);white-space:nowrap}
.tmpl{white-space:pre-wrap;font-size:.9rem}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:18px;width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgb(0 0 0 / .45)}
dialog h2{margin:0 0 12px}
dialog hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.kitem{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.kitem .meta{color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="badge" aria-label="Event badge">
    <div class="strap"></div>
    <div class="inner">
      <div>
        <h1>AGS Study Pack</h1>
        <div class="sub">WOW TRK at Affiliate Grand Slam · Fiera Roma · 2-5 Nov 2026</div>
      </div>
      <div class="stand"><span class="lbl">Stand</span><span class="num">H2-2033</span></div>
    </div>
  </header>

  <p class="unlocking" id="unlocking">Unlocking…</p>

  <main id="login" hidden>
    <form class="login" id="loginForm" autocomplete="on">
      <h2>Sign in</h2>
      <p class="src" style="margin:0">WOW TRK team study pack. Your name goes into your connect link.</p>
      <label>Your name<input id="inName" name="name" autocomplete="name" required maxlength="40"></label>
      <label>Password<input id="inPass" name="password" type="password" autocomplete="current-password" required></label>
      <label class="chk"><input type="checkbox" id="inRemember" checked> Remember me on this device</label>
      <button class="btn primary" type="submit" id="inGo">Open study pack</button>
      <p class="err" id="inErr" role="alert"></p>
    </form>
  </main>

  <div id="app"></div>
  <noscript><p>This page needs JavaScript.</p></noscript>
</div>

<script>

  var K="wtk_key", N="wtk_name";
  var $=function(id){return document.getElementById(id)};
  var ls={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
  var ss={get:function(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del:function(k){try{sessionStorage.removeItem(k)}catch(e){}}};
  var b2u=function(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
  var u2b=function(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
  var subtle=window.crypto&&window.crypto.subtle;

  function getName(){try{return JSON.parse(ls.get(N)||'""')}catch(e){return ""}}
  function setName(n){ls.set(N,JSON.stringify(String(n||"").trim()))}
  function logout(){ls.del(K);ss.del(K);location.hash="";location.reload()}
  window.WTK={getName:getName,setName:setName,logout:logout};

  function showLogin(msg){
    $("unlocking").hidden=true;$("app").innerHTML="";$("login").hidden=false;
    $("inName").value=getName();$("inErr").textContent=msg||"";
    ($("inName").value?$("inPass"):$("inName")).focus();
  }

  /* decrypt with raw key bytes; AES-GCM tag check = the password check */
  function unlock(raw){
    return subtle.importKey("raw",raw,{name:"AES-GCM"},false,["decrypt"])
      .then(function(key){return subtle.decrypt({name:"AES-GCM",iv:b2u(P.iv)},key,b2u(P.ct))})
      .then(function(buf){return JSON.parse(new TextDecoder().decode(buf))});
  }
  function derive(pass){
    return subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"])
      .then(function(base){return subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b2u(P.salt),iterations:P.iter},base,256)})
      .then(function(bits){return new Uint8Array(bits)});
  }
  function mount(app){
    $("unlocking").hidden=true;$("login").hidden=true;
    $("app").innerHTML=app.h;
    var s=document.createElement("script");s.textContent=app.j;document.body.appendChild(s);
  }

  if(!subtle){$("unlocking").textContent="This browser can't unlock the pack (needs HTTPS and a modern browser).";return}

  var saved=ls.get(K)||ss.get(K);
  if(saved&&getName()){
    unlock(b2u(saved)).then(mount,function(){ls.del(K);ss.del(K);showLogin("Saved login expired. Sign in again.")});
  }else showLogin();

  $("loginForm").addEventListener("submit",function(e){
    e.preventDefault();
    var name=$("inName").value.trim(), pass=$("inPass").value;
    if(!name){$("inErr").textContent="Enter your name.";$("inName").focus();return}
    if(!pass){$("inErr").textContent="Enter the password.";$("inPass").focus();return}
    $("inGo").disabled=true;$("inErr").textContent="";$("inGo").textContent="Checking…";
    var raw;
    derive(pass).then(function(r){raw=r;return unlock(r)}).then(function(app){
      setName(name);
      var b=u2b(raw);
      if($("inRemember").checked)ls.set(K,b);else{ls.del(K);ss.set(K,b)}
      $("inPass").value="";mount(app);
    },function(){
      $("inErr").textContent="Wrong password.";$("inPass").select();
    }).then(function(){$("inGo").disabled=false;$("inGo").textContent="Open study pack"});
  });
})();
